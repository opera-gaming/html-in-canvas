<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frosty Checkboxes</title>
    <link rel="icon" href="%VITE_SITE_BASE%favicon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #060a12; --text: #eef6ff; --dim: #8fa6bf; --accent: #9fdcff; }
      #panel { box-sizing: border-box; width: 460px; display: flex; flex-direction: column; gap: 6px; }
      #panel h1 { margin: 0; font-size: 60px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
      #panel > p { margin: 8px 0 22px; color: var(--dim); font-size: 16px; }
      /* The real checkbox is hidden but still toggles; .box draws it. */
      .item { position: relative; display: flex; align-items: center; gap: 18px; padding: 24px 0; cursor: pointer; }
      .item input { position: absolute; opacity: 0; width: 1px; height: 1px; }
      .box {
        flex: none; width: 40px; height: 40px; box-sizing: border-box; border-radius: 11px;
        border: 4px solid var(--text); display: grid; place-items: center; transition: background 0.15s;
      }
      .box::after {
        content: ''; width: 9px; height: 18px; margin-top: -4px; border: solid #050b14; border-width: 0 5px 5px 0;
        transform: rotate(45deg) scale(0); transition: transform 0.15s;
      }
      .item input:checked + .box { background: var(--accent); border-color: var(--accent); }
      .item input:checked + .box::after { transform: rotate(45deg) scale(1); }
      .item input:focus-visible + .box { outline: 3px solid #9fdcff; outline-offset: 3px; }
      .text { font-size: 30px; font-weight: 800; letter-spacing: -0.01em; }
      #tune {
        position: fixed; right: 16px; top: 16px; z-index: 1; width: 300px; box-sizing: border-box; padding: 16px 18px;
        border-radius: 14px; background: #0e1520; border: 1px solid #1f2b3c; display: flex; flex-direction: column; gap: 6px;
      }
      #tune h2 { margin: 0 0 4px; font-size: 15px; font-weight: 800; }
      #tune .field-row { grid-template-columns: 72px 1fr 44px; gap: 8px; }
      #tune .field-row label, #tune .field-row output { font-size: 13px; }
      #tune button {
        margin-top: 6px; height: 32px; border-radius: 8px; border: 1px solid #2a3a50; background: #16202e; color: var(--text);
        font: 600 13px var(--font); cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="view" layoutsubtree content="drawable">
      <div id="panel" drawable>
        <h1>Winter kit</h1>
        <p>Real checkboxes in WebGL. Tick one and it frosts over.</p>
        <label class="item"><input type="checkbox" /><span class="box"></span><span class="text">Gloves</span></label>
        <label class="item"><input type="checkbox" /><span class="box"></span><span class="text">Scarf</span></label>
        <label class="item"><input type="checkbox" /><span class="box"></span><span class="text">Wool socks</span></label>
        <label class="item"><input type="checkbox" /><span class="box"></span><span class="text">Hot cocoa</span></label>
      </div>
    </canvas>
    <aside id="tune">
      <h2>shd_frost settings</h2>
      <div class="field-row"><label for="reach">Reach</label><input id="reach" type="range" min="0.05" max="0.35" step="0.005" value="0.15" /><output for="reach"></output></div>
      <div class="field-row"><label for="flow">Flow</label><input id="flow" type="range" min="0.05" max="2" step="0.05" value="0.5" /><output for="flow"></output></div>
      <div class="field-row"><label for="waviness">Waviness</label><input id="waviness" type="range" min="2" max="16" step="0.5" value="2" /><output for="waviness"></output></div>
      <div class="field-row"><label for="sheen">Sheen</label><input id="sheen" type="range" min="0" max="2.5" step="0.05" value="2.5" /><output for="sheen"></output></div>
      <button type="button" id="reset">Reset</button>
    </aside>
    <a class="back" href="%VITE_SITE_BASE%">← All demos</a>
    <script type="module" src="/src/frost.ts"></script>
  </body>
</html>
