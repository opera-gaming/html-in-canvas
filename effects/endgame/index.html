<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dust to Dust</title>
    <link rel="icon" href="%VITE_SITE_BASE%favicon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #0d0b09; --dim: #b3aa9c; --accent: #d4a73a; }
      /* Ordinary DOM, not drawn through the effect. */
      #controls {
        position: fixed; left: 0; right: 0; top: max(48px, 9vh); z-index: 1;
        display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 0 16px;
      }
      #controls h1 { margin: 0; font-size: 52px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
      #controls p { margin: 0; color: var(--dim); font-size: 16px; }
      #panel {
        box-sizing: border-box; width: 440px; padding: 26px 28px 28px; border-radius: 22px;
        background: #1d1915; border: 1px solid #3a332b;
        display: flex; flex-direction: column; gap: 16px;
      }
      #panel h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
      #panel p { margin: 0 0 4px; font-size: 15px; line-height: 1.45; color: var(--dim); }
      #panel .colour-row { display: flex; align-items: center; justify-content: space-between; }
      #panel .colour-row label { font-size: 15px; font-weight: 600; color: var(--dim); }
    </style>
  </head>
  <body>
    <canvas id="view" layoutsubtree content="drawable">
      <div id="panel" drawable>
        <h2>Stone settings</h2>
        <p>A real form, drawn into WebGL. Pick the stone, then flip the switch above and watch it crumble.</p>
        <div class="colour-row">
          <label for="colour">Stone colour</label>
          <input id="colour" type="color" value="#b2a498" />
        </div>
        <div class="field-row">
          <label for="speed">Duration</label>
          <input id="speed" type="range" min="1" max="8" step="0.5" value="4" />
          <output for="speed"></output>
        </div>
        <div class="field-row">
          <label for="grain">Grain</label>
          <input id="grain" type="range" min="3" max="30" step="0.5" value="24" />
          <output for="grain"></output>
        </div>
        <div class="field-row">
          <label for="sweep">Sweep</label>
          <input id="sweep" type="range" min="0" max="100" step="1" value="50" />
          <output for="sweep"></output>
        </div>
        <div class="field-row">
          <label for="blow">Blow</label>
          <input id="blow" type="range" min="5" max="60" step="1" value="25" />
          <output for="blow"></output>
        </div>
        <div class="field-row">
          <label for="dust">Dust</label>
          <input id="dust" type="range" min="0" max="100" step="1" value="80" />
          <output for="dust"></output>
        </div>
      </div>
    </canvas>
    <div id="controls">
      <h1>Dust to dust</h1>
      <p>The panel below is live HTML. Flip the switch to turn it to stone and blow it away.</p>
      <button id="toggle" class="pill" role="switch" aria-checked="true"><span class="knob-track"></span>Panel</button>
    </div>
    <a class="back" href="%VITE_SITE_BASE%">← All demos</a>
    <script type="module" src="/src/endgame.ts"></script>
  </body>
</html>
